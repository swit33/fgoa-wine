<?xml version="1.0"?>
<!-- FGO Arcade: шейдеры игры используют объявления структур внутри структур,
     что NVIDIA-компилятор допускает, а Mesa по умолчанию нет. -->
<driconf>
    <device>
        <application name="FGO Arcade" executable="ago.exe">
            <option name="allow_glsl_embedded_structure_declarations" value="true"/>
        </application>
    </device>
</driconf>
